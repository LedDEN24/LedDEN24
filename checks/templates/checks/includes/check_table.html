<div class="table-responsive">
    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>Адрес</th>
            <th>ФИО</th>
            <th>Статус</th>
            <th>Риск</th>
            <th>Дата</th>
        </tr>
        </thead>
        <tbody>
        {% for check in checks %}
            <tr>
                <td><a href="{% url 'checks:report' check.pk %}">#{{ check.pk }}</a></td>
                <td>{{ check.address }}</td>
                <td>{{ check.full_name }}</td>
                <td>{{ check.get_status_display }}</td>
                <td>{{ check.risk_score }}/100 {{ check.get_risk_level_display }}</td>
                <td>{{ check.created_at|date:"d.m.Y H:i" }}</td>
            </tr>
        {% empty %}
            <tr><td colspan="6" class="text-muted">Проверок пока нет.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
