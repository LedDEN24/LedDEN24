<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}LedDEN24{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'checks:dashboard' %}">LedDEN24</a>
        <div class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'checks:check-create' %}">Новая проверка</a>
                <a class="nav-link" href="{% url 'checks:history' %}">История</a>
                <a class="nav-link" href="/api/docs/">API</a>
            {% else %}
                <a class="nav-link" href="{% url 'checks:login' %}">Войти</a>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container py-4">
    {% block content %}{% endblock %}
</main>
</body>
</html>
