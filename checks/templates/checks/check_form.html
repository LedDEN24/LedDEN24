{% extends "checks/base.html" %}
{% block title %}Новая проверка{% endblock %}
{% block content %}
<h1 class="mb-4">Новая проверка</h1>
<form method="post" class="card card-body">
    {% csrf_token %}
    <div class="row g-3">
        {% for field in form %}
            <div class="col-md-6">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
            </div>
        {% endfor %}
    </div>
    <div class="mt-4">
        <button class="btn btn-primary" type="submit">Запустить парсинг</button>
        <a class="btn btn-outline-secondary" href="{% url 'checks:dashboard' %}">Отмена</a>
    </div>
</form>
{% endblock %}
