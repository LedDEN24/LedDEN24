services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: charity
      POSTGRES_USER: charity
      POSTGRES_PASSWORD: charity
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charity -d charity"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  web:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    expose:
      - "8000"

  celery:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    depends_on:
      - web
      - redis
      - postgres
    volumes:
      - media:/app/media

  celery-beat:
    build: .
    command: celery -A config beat -l info
    env_file: .env
    depends_on:
      - web
      - redis
      - postgres

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/staticfiles:ro
      - media:/media:ro

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:
