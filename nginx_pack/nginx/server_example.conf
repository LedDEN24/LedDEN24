# Example Nginx server block (minimal). Replace DOMAIN and SSL paths.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # (Optional) redirect to HTTPS if you have certs
    # return 301 https://$host$request_uri;

    # Django app (example)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Include YooKassa webhook location:
    # include /etc/nginx/snippets/yookassa_webhook.conf;
}
