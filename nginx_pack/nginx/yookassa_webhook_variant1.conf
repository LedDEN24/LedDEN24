# YooKassa webhook (Variant 1): IP allowlist in Nginx -> proxy to Django
# Place inside your `server { ... }` block.

location = /payments/yookassa/webhook/ {
    # IP allowlist (YooKassa)
    allow 185.71.76.0/27;
    allow 185.71.77.0/27;
    allow 77.75.153.0/25;
    allow 77.75.156.11/32;
    allow 77.75.156.35/32;
    allow 77.75.154.128/25;
    allow 2a02:5180::/32;
    deny all;

    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;

    # Real client IP into Django
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_buffering off;
}
