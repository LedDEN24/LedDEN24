# YooKassa webhook (Variant 3): IP allowlist in Nginx + add Basic Authorization header when proxying to Django
# Place inside your `server { ... }` block.
#
# 1) Create base64:
#    printf "webhookuser:secret" | base64
# 2) Put the result into Authorization header below.
# 3) In Django .env set:
#    YOOKASSA_WEBHOOK_USER=webhookuser
#    YOOKASSA_WEBHOOK_PASS=secret

location = /payments/yookassa/webhook/ {
    # IP allowlist (YooKassa)
    allow 185.71.76.0/27;
    allow 185.71.77.0/27;
    allow 77.75.153.0/25;
    allow 77.75.156.11/32;
    allow 77.75.156.35/32;
    allow 77.75.154.128/25;
    allow 2a02:5180::/32;
    deny all;

    proxy_pass http://127.0.0.1:8000;

    # Replace the value with your own base64 of "user:pass"
    proxy_set_header Authorization "Basic REPLACE_ME_BASE64_USERPASS";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_buffering off;
}
