[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-due-diligence"
version = "0.1.0"
description = "Django backend for automated real-estate risk checks"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.0",
  "djangorestframework>=3.15",
  "djangorestframework-simplejwt>=5.3",
  "celery>=5.4",
  "redis>=5.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "aiohttp>=3.9",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "cryptography>=42.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "elasticsearch>=8.14",
  "python-json-logger>=2.0",
  "django-filter>=24.2",
  "drf-spectacular>=0.27",
  "weasyprint>=62.0",
  "gunicorn>=22.0",
  "whitenoise>=6.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-django>=4.8",
  "ruff>=0.5",
  "mypy>=1.10",
]
browser = [
  "playwright>=1.45",
  "selenium>=4.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/checks/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "real_estate_check.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.setuptools]
packages = [
  "analysis",
  "apps",
  "apps.checks",
  "apps.checks.migrations",
  "parsers",
  "real_estate_check",
  "reports",
]
