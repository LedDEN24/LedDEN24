[project]
name = "ledden24-estate-guard"
version = "0.1.0"
description = "Django platform for real estate due diligence, open-source parsing, risk analysis, and reporting."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-filter>=24.0",
    "django-environ>=0.11",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright>=1.43",
    "selenium>=4.20",
    "cryptography>=42.0",
    "openai>=1.30",
    "elasticsearch>=8.13",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "drf-spectacular>=0.27",
    "django-prometheus>=2.3",
    "python-json-logger>=2.0",
    "gunicorn>=22.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "estate_guard*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests>=2.32",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "estate_guard.settings"
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
exclude = ["migrations"]
