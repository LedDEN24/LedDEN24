global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: django
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8000"]
  - job_name: celery-flower
    static_configs:
      - targets: ["flower:5555"]
