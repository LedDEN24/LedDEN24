{% extends "base.html" %}
{% block title %}{{ article.title }} - Global Care{% endblock %}
{% block content %}<article class="mx-auto max-w-3xl px-4 py-16"><p class="text-sm text-slate-500">{{ article.published_at|date:"M d, Y" }}</p><h1 class="mt-3 text-4xl font-black">{{ article.title }}</h1><p class="mt-5 text-lg text-slate-600 dark:text-slate-400">{{ article.excerpt }}</p><div class="prose mt-10 max-w-none dark:prose-invert">{{ article.body|linebreaks }}</div></article>{% endblock %}
