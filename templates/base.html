{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Property Risk Check{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'dashboard' %}">RiskCheck</a>
    <div class="navbar-nav ms-auto">
      {% if user.is_authenticated %}
        <a class="nav-link" href="{% url 'check-create' %}">Новая проверка</a>
        <a class="nav-link" href="{% url 'history' %}">История</a>
        <form method="post" action="{% url 'logout' %}" class="d-inline">
          {% csrf_token %}
          <button class="btn btn-link nav-link" type="submit">Выйти</button>
        </form>
      {% else %}
        <a class="nav-link" href="{% url 'login' %}">Войти</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container py-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
